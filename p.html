<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Konuq Hub</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<div class="wrap">
			<div class="topbar">
				<div class="brand">
					<div id="navBar" class="navBar" style="display:none">
						<a id="backLink" class="backLink" href="#" style="display:none">← Back</a>
						<a id="homeLink" class="backLink" href="#" style="display:none">Home</a>
					</div>
					<div class="kicker">Konuq</div>
					<h1 id="hubTitle">Loading…</h1>
				</div>
				<div class="actions">
					<div class="pill" id="statusPill">Fetching</div>
				</div>
			</div>

			<div id="grid" class="grid" style="opacity:0;transform:translateY(4px);transition:opacity .22s ease, transform .22s ease"></div>
			<div id="empty" class="empty" style="display:none"></div>

			<div id="detail" class="detail" style="display:none">
				<div class="detailHead">
					<h2 id="detailTitle"></h2>
					<div class="meta" id="detailMeta"></div>
				</div>
				<div id="detailBody" class="detailBody"></div>
			</div>

			<div class="footer">
				<span>Made with</span>
				<a class="footerLink" href="https://apps.apple.com/app/id0000000000" target="_blank" rel="noopener noreferrer">Konuq</a>
			</div>
		</div>

		<script>
			const SUPABASE_URL = "https://frqkwxfdvaqtongvfzoo.supabase.co"
			const BUCKET = "published_hubs"
			// When the viewer is opened at the site root (konuq.app/), render this
			// published hub. Prefer LANDING_SLUG (the hub's public address); the
			// LANDING_SHARE_ID fallback works too. Both empty = show a placeholder.
			const LANDING_SLUG = "landing"
			const LANDING_SHARE_ID = ""
			// Public anon key — used only to call resolve_published_slug (public data).
			const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZycWt3eGZkdmFxdG9uZ3Zmem9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5OTcwMzQsImV4cCI6MjA5MzU3MzAzNH0.hNTXycNbf8-IUY92Vhwb4egJA_DL3vt61QU68nqMsAQ"

			// Turn a title into a URL-safe slug (accents stripped, lowercased, hyphenated).
			const slugify = (s) => String(s || "")
				.normalize("NFKD")
				.toLowerCase()
				.replace(/[^a-z0-9]+/g, "-")
				.replace(/^-+|-+$/g, "")
				.slice(0, 60) || "untitled"

			const hubTitleEl = document.getElementById("hubTitle")
			const statusPillEl = document.getElementById("statusPill")
			const gridEl = document.getElementById("grid")
			const emptyEl = document.getElementById("empty")
			const detailEl = document.getElementById("detail")
			const detailTitleEl = document.getElementById("detailTitle")
			const detailMetaEl = document.getElementById("detailMeta")
			const detailBodyEl = document.getElementById("detailBody")
			const backLinkEl = document.getElementById("backLink")
			const homeLinkEl = document.getElementById("homeLink")
			const navBarEl = document.getElementById("navBar")

			const state = {
				payload: null,
				shareId: null,
				hubSlug: null,
				selectedCollectionId: null,
				selectedNoteUuid: null,
				collectionSlugById: {},
				collectionIdBySlug: {},
				noteSlugCache: {}
			}

			const normalizedTagKey = (raw) => {
				if (!raw) return ""
				return String(raw).trim().replace(/^#/, "").toLowerCase()
			}

			const storagePublicURL = (shareId, path) => {
				return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${encodeURIComponent(shareId)}/${path}`
			}

			// A fresh query string each load: the storage CDN caches objects by URL for an
			// hour, and a republished hub must show up right away.
			const payloadURL = (shareId) => `${storagePublicURL(shareId, "payload.json")}?v=${Date.now()}`

			const COLOR_ASSET_TO_CSS_VAR = {
				appAccentColor: "--accent",
				tag1Color: "--tag1",
				tag2Color: "--tag2",
				tag3Color: "--tag3",
				tag4Color: "--tag4",
				tag5Color: "--tag5",
				tag6Color: "--tag6",
				allTagColor: "--tagAll"
			}

			const resolveColorValue = (raw) => {
				if (!raw) return null
				const v = String(raw).trim()
				if (!v) return null
				if (v.startsWith("#") || v.startsWith("rgb(") || v.startsWith("rgba(") || v.startsWith("hsl(")) return v
				const cssVar = COLOR_ASSET_TO_CSS_VAR[v]
				return cssVar ? `var(${cssVar})` : null
			}

			const computeColumnCount = (width, spacing) => {
				const minColumns = 4
				const maxColumns = 10
				const idealCellSize = 110
				const raw = Math.floor((width + spacing) / (idealCellSize + spacing))
				return Math.max(minColumns, Math.min(raw, maxColumns))
			}

			const placeTiles = (tiles, cols) => {
				const occupied = new Set()
				const key = (r, c) => `${r}:${c}`
				const isFree = (r, c) => !occupied.has(key(r, c))
				const canPlace = (r, c, w, h) => {
					if (c + w - 1 > cols) return false
					for (let rr = r; rr < r + h; rr++) {
						for (let cc = c; cc < c + w; cc++) {
							if (!isFree(rr, cc)) return false
						}
					}
					return true
				}
				const mark = (r, c, w, h) => {
					for (let rr = r; rr < r + h; rr++) {
						for (let cc = c; cc < c + w; cc++) {
							occupied.add(key(rr, cc))
						}
					}
				}

				const result = []
				let cursorRow = 1
				for (const t of tiles) {
					const w = Math.max(1, Math.min(cols, Number(t.spanColumns || 1)))
					const h = Math.max(1, Number(t.spanRows || 1))
					let placed = false
					for (let r = 1; !placed && r < 400; r++) {
						for (let c = 1; !placed && c <= cols; c++) {
							if (canPlace(r, c, w, h)) {
								mark(r, c, w, h)
								result.push({ id: t.id, row: r, col: c, w, h })
								placed = true
								cursorRow = Math.max(cursorRow, r)
							}
						}
					}
					if (!placed) {
						result.push({ id: t.id, row: cursorRow, col: 1, w: 1, h: 1 })
						cursorRow += 1
					}
				}
				return result
			}

			const resolveImageURL = (mediaReference) => {
				const payload = state.payload
				if (!payload || !payload.mediaIndex) return null
				const rel = payload.mediaIndex[mediaReference]
				if (!rel) return null
				return storagePublicURL(state.shareId, rel)
			}

			const renderEmpty = (title, message) => {
				hubTitleEl.textContent = title
				statusPillEl.textContent = "Not available"
				gridEl.style.display = "none"
				emptyEl.style.display = "block"
				emptyEl.innerHTML = ""
				const strong = document.createElement("strong")
				strong.textContent = title
				const d = document.createElement("div")
				d.style.marginTop = "10px"
				d.textContent = message
				emptyEl.appendChild(strong)
				emptyEl.appendChild(d)
			}

			const tileTagList = (tags) => {
				const list = (tags || []).map(normalizedTagKey).filter(Boolean)
				return list.slice(0, 6)
			}

			const renderGrid = () => {
				const payload = state.payload
				if (!payload) return
				hubTitleEl.textContent = payload.hub?.title || "Konuq Hub"
				statusPillEl.textContent = "Public"

				const tiles = (payload.collections || [])
					.slice()
					.sort((a, b) => Number(a.position || 0) - Number(b.position || 0))

				const updateColumns = () => {
					const style = getComputedStyle(gridEl)
					const spacing = Number.parseFloat(style.columnGap || style.gap || "14") || 14
					const cols = computeColumnCount(gridEl.clientWidth, spacing)
					gridEl.style.setProperty("--cols", String(cols))
					const cell = Math.max(0, Math.floor((gridEl.clientWidth - spacing * (cols - 1)) / cols))
					gridEl.style.setProperty("--row", `${cell}px`)
					const placements = placeTiles(tiles, cols)
					for (const p of placements) {
						const el = gridEl.querySelector(`[data-tile-id="${p.id}"]`)
						if (!el) continue
						el.style.gridColumn = `${p.col} / span ${p.w}`
						el.style.gridRow = `${p.row} / span ${p.h}`
					}
				}

				gridEl.innerHTML = ""
				for (const c of tiles) {
					const tile = document.createElement("div")
					tile.className = "tile"
					tile.dataset.tileId = c.id

					const bgUrl = c.backgroundValue && String(c.backgroundValue).startsWith("media:") ? resolveImageURL(c.backgroundValue) : null
					const isImage = c.backgroundKind === "image" && !!bgUrl
					if (!isImage) tile.classList.add("noImage")

					if (isImage) {
						const bg = document.createElement("div")
						bg.className = "tileBg"
						bg.style.backgroundImage = `url("${bgUrl}")`
						tile.appendChild(bg)
					} else if (c.backgroundKind === "color" && c.backgroundValue) {
						const v = resolveColorValue(c.backgroundValue) ?? "var(--tag3)"
						tile.style.background = v
					}

					const content = document.createElement("div")
					content.className = "tileContent"
					const header = document.createElement("div")
					header.className = "tileHeader"
					const emoji = document.createElement("div")
					emoji.className = "emoji"
					emoji.textContent = c.emoji || "📌"
					const titleWrap = document.createElement("div")
					titleWrap.className = "tileTitle"
					const h2 = document.createElement("h2")
					h2.textContent = c.showTitle === false ? "" : (c.title || "")
					titleWrap.appendChild(h2)
					header.appendChild(emoji)
					header.appendChild(titleWrap)

					content.appendChild(header)
					
					const spanRows = Math.max(1, Number(c.spanRows || 1))
					const spanColumns = Math.max(1, Number(c.spanColumns || 1))
					const is1x1 = spanRows === 1 && spanColumns === 1
					if (is1x1) tile.classList.add("tile1x1")
					if (spanRows > 1) {
						const count = notesForCollection(c).length
						const countEl = document.createElement("div")
						countEl.className = "tileCount"
						countEl.textContent = `${count} ${count === 1 ? "note" : "notes"}`
						content.appendChild(countEl)
					}
					tile.appendChild(content)

					tile.addEventListener("click", () => navigate({ collectionId: c.id }))
					gridEl.appendChild(tile)

					if (is1x1) {
						requestAnimationFrame(() => {
							const maxHeight = content.clientHeight - emoji.offsetHeight - 8
							if (maxHeight <= 0) return
							let size = 14
							h2.style.display = "block"
							h2.style.whiteSpace = "normal"
							h2.style.overflow = "hidden"
							h2.style.webkitLineClamp = "unset"
							h2.style.webkitBoxOrient = "unset"
							while (size >= 10) {
								h2.style.fontSize = `${size}px`
								if (h2.scrollHeight <= maxHeight) break
								size -= 1
							}
						})
					}
				}

				const ro = new ResizeObserver(() => updateColumns())
				ro.observe(gridEl)
				updateColumns()
				gridEl.style.opacity = "1"
				gridEl.style.transform = "translateY(0px)"
			}

			const notesForCollection = (collection) => {
				const payload = state.payload
				if (!payload) return []
				const requiredTags = (collection.tags || []).map(normalizedTagKey).filter(Boolean)
				if (!requiredTags.length || collection.isTagsConfirmed === false) return []
				const required = new Set(requiredTags)
				return (payload.notes || []).filter((n) => {
					const tags = new Set((n.tags || []).map(normalizedTagKey).filter(Boolean))
					for (const t of required) if (!tags.has(t)) return false
					return true
				})
			}

			const noteTitleFromBlocks = (note) => {
				const blocks = note.blocks || []
				const title = blocks.find((b) => b.type === "TITLE" && b.markdown && String(b.markdown).trim())
				if (title) return mdToPlainText(title.markdown)
				for (const b of blocks) {
					if (b.type === "STOP") {
						const s = parseStopBlock(b)
						if (s && (s.title || s.address)) return String(s.title || s.address).slice(0, 40)
					} else if (b.type !== "IMAGE" && b.type !== "VIDEO" && b.markdown && String(b.markdown).trim()) {
						// Photo captions describe a photo, never the note.
						return mdToPlainText(b.markdown).slice(0, 40)
					}
				}
				return "Untitled"
			}

			// The note's first photo, as the app's list thumbnail: the first top-level
			// IMAGE block whose file is in the published media index.
			const noteThumbnailURL = (note) => {
				const blocks = (note.blocks || []).slice().sort((a, c) => Number(a.position || 0) - Number(c.position || 0))
				for (const b of blocks) {
					if (b.type !== "IMAGE" || b.parentId) continue
					const ref = String(b.mediaReference || "")
					if (!ref.startsWith("media:")) continue
					const url = resolveImageURL(ref)
					if (url) return url
				}
				return null
			}

			const notePreviewFromBlocks = (note) => {
				const blocks = (note.blocks || []).filter((b) => b.type !== "TITLE")
				for (const b of blocks) {
					if (b.type === "STOP") {
						const s = parseStopBlock(b)
						const txt = s ? [s.title, s.address].filter(Boolean).join(" — ") : ""
						if (txt) return txt
					} else if (b.markdown && String(b.markdown).trim()) {
						return mdToPlainText(b.markdown)
					}
				}
				return ""
			}

			// ---- Client-side routing ----
			// URL forms, in priority order:
			//   /<hubSlug>[/<colSlug>[/<noteSlug>]]  pretty public URLs (default)
			//   /p/<shareId>[/c/<id>[/n/<uuid>]]     legacy, still supported
			//   ?shareId=&c=&n=                      local testing
			//   /                                    -> landing hub (LANDING_SHARE_ID)
			const RESERVED_FIRST_SEGMENTS = new Set([
				"p", "p.html", "index.html", "styles.css", "favicon.ico", "assets", "api"
			])

			const parseRoute = () => {
				const parts = window.location.pathname.split("/").filter(Boolean)
				const pIndex = parts.indexOf("p")
				if (pIndex !== -1) {
					const sid = parts[pIndex + 1] || null
					const rest = parts.slice(pIndex + 2)
					let collectionId = null, noteUuid = null
					for (let i = 0; i < rest.length; i += 2) {
						if (rest[i] === "c") collectionId = decodeURIComponent(rest[i + 1] || "")
						else if (rest[i] === "n") noteUuid = decodeURIComponent(rest[i + 1] || "")
					}
					return { mode: "shareId", shareId: sid, collectionId: collectionId || null, noteUuid: noteUuid || null }
				}
				const params = new URLSearchParams(window.location.search)
				if (params.get("shareId")) {
					return { mode: "shareId", shareId: params.get("shareId"), collectionId: params.get("c") || null, noteUuid: params.get("n") || null }
				}
				const first = parts[0] ? decodeURIComponent(parts[0]) : null
				if (first && !RESERVED_FIRST_SEGMENTS.has(first)) {
					return {
						mode: "slug",
						hubSlug: first,
						collectionSlug: parts[1] ? decodeURIComponent(parts[1]) : null,
						noteSlug: parts[2] ? decodeURIComponent(parts[2]) : null
					}
				}
				// Site root: show the configured landing hub (by slug, or share_id).
				if (LANDING_SLUG) {
					return { mode: "slug", hubSlug: LANDING_SLUG, collectionSlug: null, noteSlug: null }
				}
				return { mode: "shareId", shareId: LANDING_SHARE_ID || null, collectionId: null, noteUuid: null }
			}

			// Resolve a public slug (or old alias) to its storage share_id via RPC.
			const resolveSlug = async (slug) => {
				try {
					const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/resolve_published_slug`, {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
							"apikey": SUPABASE_ANON_KEY,
							"Authorization": `Bearer ${SUPABASE_ANON_KEY}`
						},
						body: JSON.stringify({ lookup: slug })
					})
					if (!res.ok) return null
					const rows = await res.json()
					const row = Array.isArray(rows) ? rows[0] : rows
					if (!row || !row.share_id) return null
					return { shareId: row.share_id, canonicalSlug: row.canonical_slug || null, redirect: !!row.redirect }
				} catch {
					return null
				}
			}

			// Collection slug maps for the loaded payload (id <-> slug, deduped).
			const buildCollectionSlugMaps = () => {
				const tiles = (state.payload?.collections || []).slice()
					.sort((a, b) => Number(a.position || 0) - Number(b.position || 0))
				const byId = {}, bySlug = {}
				const used = new Set()
				for (const c of tiles) {
					const base = slugify(c.title || c.emoji || c.id)
					let s = base, i = 2
					while (used.has(s)) { s = `${base}-${i++}` }
					used.add(s); byId[c.id] = s; bySlug[s] = c.id
				}
				state.collectionSlugById = byId
				state.collectionIdBySlug = bySlug
			}

			// Note slug maps are per-collection (a note can appear in several).
			const noteSlugMapsForCollection = (collection) => {
				if (!collection) return { byUuid: {}, bySlug: {} }
				if (state.noteSlugCache[collection.id]) return state.noteSlugCache[collection.id]
				const notes = notesForCollection(collection)
				const byUuid = {}, bySlug = {}
				const used = new Set()
				for (const n of notes) {
					const base = slugify(noteTitleFromBlocks(n))
					let s = base, i = 2
					while (used.has(s)) { s = `${base}-${i++}` }
					used.add(s); byUuid[n.uuid] = s; bySlug[s] = n.uuid
				}
				const maps = { byUuid, bySlug }
				state.noteSlugCache[collection.id] = maps
				return maps
			}

			// Turn a parsed route's segments into concrete ids using the loaded payload.
			const resolveRouteSegments = (route) => {
				if (route.mode === "slug") {
					const collectionId = route.collectionSlug ? (state.collectionIdBySlug[route.collectionSlug] || null) : null
					let noteUuid = null
					if (collectionId && route.noteSlug) {
						const col = (state.payload?.collections || []).find((c) => c.id === collectionId)
						noteUuid = noteSlugMapsForCollection(col).bySlug[route.noteSlug] || null
					}
					return { collectionId, noteUuid }
				}
				return { collectionId: route.collectionId || null, noteUuid: route.noteUuid || null }
			}

			const buildRouteURL = ({ collectionId = null, noteUuid = null } = {}) => {
				const sid = state.shareId
				// Pretty slug URLs when we know the hub's public slug.
				if (state.hubSlug) {
					// The landing hub lives at the bare root.
					if (LANDING_SLUG && state.hubSlug === LANDING_SLUG && !collectionId) return "/"
					let path = `/${encodeURIComponent(state.hubSlug)}`
					if (collectionId) {
						const cslug = state.collectionSlugById[collectionId]
						if (cslug) {
							path += `/${encodeURIComponent(cslug)}`
							if (noteUuid) {
								const col = (state.payload?.collections || []).find((c) => c.id === collectionId)
								const nslug = noteSlugMapsForCollection(col).byUuid[noteUuid]
								if (nslug) path += `/${encodeURIComponent(nslug)}`
							}
						}
					}
					return path
				}
				const parts = window.location.pathname.split("/").filter(Boolean)
				if (parts.indexOf("p") !== -1) {
					let path = `/p/${encodeURIComponent(sid)}`
					if (collectionId) path += `/c/${encodeURIComponent(collectionId)}`
					if (noteUuid) path += `/n/${encodeURIComponent(noteUuid)}`
					return path
				}
				const q = new URLSearchParams()
				q.set("shareId", sid)
				if (collectionId) q.set("c", collectionId)
				if (noteUuid) q.set("n", noteUuid)
				return `${window.location.pathname}?${q.toString()}`
			}

			const navigate = (target, { push = true } = {}) => {
				const t = { collectionId: target.collectionId || null, noteUuid: target.noteUuid || null }
				if (push) history.pushState(t, "", buildRouteURL(t))
				renderRoute(t)
			}

			// Configure the header nav: an optional "back" button and an optional
			// "Home" button (Home always jumps to the hub grid).
			const setNav = ({ back = null, home = false } = {}) => {
				let anyShown = false
				if (back) {
					backLinkEl.style.display = "inline-flex"
					backLinkEl.textContent = back.label || "← Back"
					backLinkEl.href = buildRouteURL(back.target)
					backLinkEl.onclick = (e) => { e.preventDefault(); navigate(back.target) }
					anyShown = true
				} else {
					backLinkEl.style.display = "none"
					backLinkEl.onclick = null
				}
				if (home) {
					homeLinkEl.style.display = "inline-flex"
					homeLinkEl.textContent = "Home"
					homeLinkEl.href = buildRouteURL({})
					homeLinkEl.onclick = (e) => { e.preventDefault(); navigate({}) }
					anyShown = true
				} else {
					homeLinkEl.style.display = "none"
					homeLinkEl.onclick = null
				}
				navBarEl.style.display = anyShown ? "flex" : "none"
			}

			const showHub = () => {
				detailEl.style.display = "none"
				emptyEl.style.display = "none"
				gridEl.style.display = ""
			}
			const showDetail = () => {
				gridEl.style.display = "none"
				emptyEl.style.display = "none"
				detailEl.style.display = "block"
			}

			let gridBuilt = false
			const renderHubView = () => {
				const payload = state.payload
				setNav({})
				showHub()
				hubTitleEl.style.display = ""
				hubTitleEl.textContent = payload?.hub?.title || "Konuq Hub"
				statusPillEl.textContent = "Public"
				document.title = payload?.hub?.title ? `${payload.hub.title} · Konuq` : "Konuq Hub"
				if (!gridBuilt) { renderGrid(); gridBuilt = true }
				window.scrollTo(0, 0)
			}

			const renderCollectionView = (collectionId) => {
				const payload = state.payload
				const collection = (payload?.collections || []).find((c) => c.id === collectionId)
				if (!collection) { renderHubView(); return }
				state.selectedCollectionId = collectionId
				state.selectedNoteUuid = null
				showDetail()
				setNav({ home: true })
				hubTitleEl.style.display = "none"
				const title = `${collection.emoji || "📌"} ${collection.title || ""}`.trim()
				detailTitleEl.textContent = title
				const tags = (collection.tags || []).map(normalizedTagKey).filter(Boolean).map((t) => `#${t}`)
				detailMetaEl.textContent = tags.join("  ")
				document.title = `${collection.title || "Collection"} · Konuq`
				detailBodyEl.innerHTML = ""

				const notes = notesForCollection(collection)
				if (!notes.length) {
					const empty = document.createElement("div")
					empty.className = "empty"
					const strong = document.createElement("strong")
					strong.textContent = "No notes"
					const d = document.createElement("div")
					d.style.marginTop = "10px"
					d.textContent = "This collection has no matching notes in the published hub."
					empty.appendChild(strong)
					empty.appendChild(d)
					detailBodyEl.appendChild(empty)
					window.scrollTo(0, 0)
					return
				}

				// The collection's layout, chosen in the app: list (photo on the right),
				// cover (photo large on top), grid (two per row) or compact (slim rows).
				const layout = ["list", "cover", "poster", "grid", "compact"].includes(collection.layout) ? collection.layout : "list"
				const cards = document.createElement("div")
				cards.className = `noteCards layout-${layout}`
				for (const n of notes) {
					const card = document.createElement("div")
					card.className = "noteCard"
					const thumbURL = noteThumbnailURL(n)
					// Poster needs a photo to sit on; without one the card falls back to list.
					if (layout === "poster") card.className = thumbURL ? "noteCard noteCardPoster" : "noteCard noteCardListFallback"
					if (thumbURL && layout !== "list") {
						const img = document.createElement("img")
						img.className = "noteCardPhoto"
						img.loading = "lazy"
						img.decoding = "async"
						img.src = thumbURL
						img.alt = ""
						card.appendChild(img)
					} else if (layout === "grid") {
						// Keeps every grid card the same height, as the app does.
						const slot = document.createElement("div")
						slot.className = "noteCardPhoto noteCardPhotoEmpty"
						card.appendChild(slot)
					}
					const text = document.createElement("div")
					text.className = "noteCardText"
					const h = document.createElement("div")
					h.className = "noteCardTitle"
					h.textContent = noteTitleFromBlocks(n)
					text.appendChild(h)
					if (layout === "list" || layout === "cover" || layout === "poster") {
						const p = document.createElement("p")
						p.className = "noteCardPreview"
						p.textContent = notePreviewFromBlocks(n)
						text.appendChild(p)
					}
					card.appendChild(text)
					if (thumbURL && (layout === "list" || (layout === "poster" && !card.classList.contains("noteCardPoster")))) {
						const img = document.createElement("img")
						img.className = "noteCardThumb"
						img.loading = "lazy"
						img.decoding = "async"
						img.src = thumbURL
						img.alt = ""
						card.appendChild(img)
					}
					card.addEventListener("click", () => navigate({ collectionId, noteUuid: n.uuid }))
					cards.appendChild(card)
				}
				detailBodyEl.appendChild(cards)
				window.scrollTo(0, 0)
			}

			// Mirrors the editor's type scale: TITLE is the H1, DESCRIPTION the H2
			// (26pt bold, despite the name), then HEADING3..6.
			const blockClass = (type) => {
				switch (type) {
					case "TITLE": return "block title"
					case "DESCRIPTION": return "block description"
					case "HEADING3": return "block h3"
					case "HEADING4": return "block h4"
					case "HEADING5": return "block h5"
					case "HEADING6": return "block h6"
					case "CODE": return "block code"
					case "LIST_BULLET": return "block bullet"
					case "TOGGLE":
					case "TOGGLE_HEADER": return "block toggle"
					case "CHECKBOX": return "block checkbox"
					default: return "block"
				}
			}

			// The editor keeps the "[ ] " / "[x] " prefix inside a checkbox block's
			// text, but older rows can lack it: treat those as unchecked.
			const blockMarkdown = (b) => {
				const md = String(b.markdown ?? "")
				if (b.type === "CHECKBOX" && !checkboxMatch(md.split(/\r?\n/)[0] || "")) return "[ ] " + md
				return md
			}

			// Safe inline markdown → DOM. Builds text nodes / elements only
			// (never innerHTML), so user content can't inject markup.
			const INLINE_SAFE_SCHEME = /^(https?:|mailto:)/i
			const INTERNAL_NOTE_SCHEME = /^konuq:\/\/note\//i

			// Internal note links ("konuq://note/<uuid>") become in-page navigation:
			// find the published collection that gathers the note, so the reader lands
			// on the same route as clicking it from the grid. Notes that aren't part of
			// any published collection stay plain text.
			const routeForNoteUuid = (uuid) => {
				const payload = state.payload
				if (!payload || !uuid) return null
				for (const collection of payload.collections || []) {
					if (notesForCollection(collection).some((n) => n.uuid === uuid)) {
						return { collectionId: collection.id, noteUuid: uuid }
					}
				}
				return null
			}
			// Bare URLs / emails in plain text become links, mirroring the editor's
			// auto-link rules (email, explicit scheme, bare domain). Blocks written by
			// the share extension hold the raw URL with no [label](url) around it.
			const AUTO_LINK_RE = (() => {
				const label = "[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?"
				const domain = `${label}(?:\\.${label})*\\.[A-Za-z]{2,}`
				const email = `[A-Za-z0-9._%+-]+@${domain}`
				const schemeUrl = "[A-Za-z][A-Za-z0-9+.-]*://[^\\s<>\"]+"
				const bareUrl = `(?:www\\.)?${domain}(?::\\d{2,5})?(?:/[^\\s<>\"]*)?`
				return new RegExp(`(?<![A-Za-z0-9@])(?:${email}|${schemeUrl}|${bareUrl})`, "g")
			})()
			// Bare tokens that are far more likely filenames than domains ("README.md").
			const NON_DOMAIN_FILE_EXTENSIONS = new Set([
				"txt", "md", "pdf", "doc", "docx", "xls", "xlsx", "ppt", "pptx", "pages", "numbers",
				"png", "jpg", "jpeg", "gif", "webp", "svg", "heic", "bmp", "tiff",
				"zip", "rar", "tar", "gz", "dmg", "pkg", "exe",
				"mp3", "mp4", "mov", "avi", "wav", "m4a",
				"csv", "json", "xml", "yml", "yaml", "log", "env",
				"swift", "kt", "java", "py", "rb", "php", "html", "css", "js", "ts"
			])
			const autoLinkURL = (token) => {
				if (token.includes("://")) return token
				if (token.includes("@")) return `mailto:${token}`
				const host = token.split("/")[0]
				const ext = host.split(".").pop().toLowerCase()
				if (NON_DOMAIN_FILE_EXTENSIONS.has(ext)) return null
				return `https://${token}`
			}
			const appendText = (frag, text, autoLink) => {
				if (!text) return
				if (!autoLink) { frag.appendChild(document.createTextNode(text)); return }
				let last = 0
				AUTO_LINK_RE.lastIndex = 0
				let m
				while ((m = AUTO_LINK_RE.exec(text))) {
					let token = m[0]
					// Trailing sentence punctuation is not part of the link.
					while (token.length && ".,;:!?\"'".includes(token[token.length - 1])) token = token.slice(0, -1)
					if (token.endsWith(")") && !token.includes("(")) token = token.slice(0, -1)
					const url = token ? autoLinkURL(token) : null
					if (!url || !INLINE_SAFE_SCHEME.test(url)) continue
					if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)))
					const a = document.createElement("a")
					a.className = "mdLink"
					a.href = url
					a.target = "_blank"
					a.rel = "noopener noreferrer"
					a.textContent = token
					frag.appendChild(a)
					last = m.index + token.length
					AUTO_LINK_RE.lastIndex = last
				}
				if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)))
			}

			const renderInlineMarkdown = (text, autoLink = true) => {
				const frag = document.createDocumentFragment()
				let src = String(text ?? "")
				// Order matters: code and bold before italic so ** and ` win.
				const re = /(`[^`]+`)|(\*\*[\s\S]+?\*\*)|(~~[\s\S]+?~~)|(\*[^*\s][\s\S]*?\*)|(\[[^\]]*\]\([^)\s]+\))/
				let m
				while ((m = re.exec(src))) {
					const idx = m.index
					if (idx > 0) appendText(frag, src.slice(0, idx), autoLink)
					const tok = m[0]
					if (m[1]) {
						const code = document.createElement("code")
						code.className = "mdCode"
						code.textContent = tok.slice(1, -1)
						frag.appendChild(code)
					} else if (m[2]) {
						const el = document.createElement("strong")
						el.appendChild(renderInlineMarkdown(tok.slice(2, -2), autoLink))
						frag.appendChild(el)
					} else if (m[3]) {
						const el = document.createElement("del")
						el.appendChild(renderInlineMarkdown(tok.slice(2, -2), autoLink))
						frag.appendChild(el)
					} else if (m[4]) {
						const el = document.createElement("em")
						el.appendChild(renderInlineMarkdown(tok.slice(1, -1), autoLink))
						frag.appendChild(el)
					} else if (m[5]) {
						const inner = tok.match(/^\[([^\]]*)\]\(([^)\s]+)\)$/)
						const label = inner ? inner[1] : tok
						const url = inner ? inner[2] : ""
						if (url && INLINE_SAFE_SCHEME.test(url)) {
							const a = document.createElement("a")
							a.className = "mdLink"
							a.href = url
							a.target = "_blank"
							a.rel = "noopener noreferrer"
							a.appendChild(renderInlineMarkdown(label, false))
							frag.appendChild(a)
						} else if (url && INTERNAL_NOTE_SCHEME.test(url)) {
							const uuid = url.replace(INTERNAL_NOTE_SCHEME, "").replace(/\/+$/, "")
							const target = routeForNoteUuid(uuid)
							if (target) {
								const a = document.createElement("a")
								a.className = "mdLink"
								a.href = buildRouteURL(target)
								a.appendChild(renderInlineMarkdown(label, false))
								a.addEventListener("click", (event) => {
									event.preventDefault()
									navigate(target)
								})
								frag.appendChild(a)
							} else {
								// Note not published in any collection here: label only.
								frag.appendChild(renderInlineMarkdown(label))
							}
						} else {
							// Unknown scheme: show the label text only.
							frag.appendChild(renderInlineMarkdown(label))
						}
					}
					src = src.slice(idx + tok.length)
				}
				appendText(frag, src, autoLink)
				return frag
			}

			const isDividerLine = (line) => /^\s*([-*_])\1{2,}\s*$/.test(line)
			const bulletMatch = (line) => line.match(/^\s*[-*]\s+(.*)$/)

			// Renders a block's markdown into `container`: dividers → <hr>,
			// "- " lines → bullet lists, everything else inline + line breaks.
			// "[ ] text" / "[x] text" (optionally "- [ ] text") → interactive checkbox row.
			const checkboxMatch = (line) => {
				// Older notes can carry the prefix inside a bold run ("**[ ] text**"):
				// accept the opener and hand it back to the label so the bold still closes.
				const m = /^\s*(?:[-*]\s+)?(\*\*|__)?\[( |x|X)\]\s?(.*)$/.exec(line)
				if (!m) return null
				return { checked: m[2].toLowerCase() === "x", text: (m[1] || "") + m[3] }
			}

			const renderBlockMarkdown = (container, markdown) => {
				const lines = String(markdown ?? "").split(/\r?\n/)
				let list = null
				let needBreak = false
				const closeList = () => { if (list) { container.appendChild(list); list = null } }
				for (const line of lines) {
					if (isDividerLine(line)) {
						closeList()
						const hr = document.createElement("hr")
						hr.className = "divider"
						container.appendChild(hr)
						needBreak = false
						continue
					}
					const cm = checkboxMatch(line)
					if (cm) {
						closeList()
						const row = document.createElement("div")
						row.className = "mdCheck" + (cm.checked ? " checked" : "")
						const box = document.createElement("span")
						box.className = "mdCheckBox"
						box.setAttribute("role", "checkbox")
						box.setAttribute("aria-checked", cm.checked ? "true" : "false")
						box.setAttribute("tabindex", "0")
						const label = document.createElement("span")
						label.className = "mdCheckLabel"
						label.appendChild(renderInlineMarkdown(cm.text))
						row.appendChild(box)
						row.appendChild(label)
						// Read-only site: toggling is local eye-candy, nothing persists.
						const toggle = () => {
							row.classList.toggle("checked")
							box.setAttribute("aria-checked", row.classList.contains("checked") ? "true" : "false")
						}
						row.addEventListener("click", toggle)
						box.addEventListener("keydown", (e) => {
							if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle() }
						})
						container.appendChild(row)
						needBreak = false
						continue
					}
					const bm = bulletMatch(line)
					if (bm) {
						if (!list) { list = document.createElement("ul"); list.className = "mdList" }
						const li = document.createElement("li")
						li.appendChild(renderInlineMarkdown(bm[1]))
						list.appendChild(li)
						needBreak = false
						continue
					}
					closeList()
					if (needBreak) container.appendChild(document.createElement("br"))
					container.appendChild(renderInlineMarkdown(line))
					needBreak = true
				}
				closeList()
			}

			// Flatten markdown to plain text for titles / previews.
			const mdToPlainText = (s) => String(s ?? "")
				.replace(/^\s*(?:[-*]\s+)?(\*\*|__)?\[ \]\s?/gm, "☐ $1")
				.replace(/^\s*(?:[-*]\s+)?(\*\*|__)?\[[xX]\]\s?/gm, "☑︎ $1")
				.replace(/`([^`]+)`/g, "$1")
				.replace(/\*\*([\s\S]+?)\*\*/g, "$1")
				.replace(/~~([\s\S]+?)~~/g, "$1")
				.replace(/\*([^*\s][\s\S]*?)\*/g, "$1")
				.replace(/\[([^\]]*)\]\([^)\s]+\)/g, "$1")
				.replace(/^\s*[-*_]{3,}\s*$/gm, "")
				.replace(/^\s*[-*]\s+/gm, "")
				.replace(/\s+/g, " ")
				.trim()

			const parseStopBlock = (b) => {
				if (!b || b.type !== "STOP" || !b.markdown) return null
				try {
					const o = JSON.parse(b.markdown)
					if (!o || typeof o !== "object") return null
					const title = o.title ? String(o.title).trim() : ""
					const address = o.address ? String(o.address).trim() : ""
					if (!title && !address) return null
					const lat = Number(o.lat)
					const lng = Number(o.lng)
					const hasCoords = Number.isFinite(lat) && Number.isFinite(lng) && !(lat === 0 && lng === 0)
					const startMs = Number(o.startDateMs)
					const dur = Number(o.durationMinutes)
					return {
						title,
						address,
						lat: hasCoords ? lat : null,
						lng: hasCoords ? lng : null,
						startDateMs: Number.isFinite(startMs) && startMs > 0 ? startMs : null,
						durationMinutes: Number.isFinite(dur) && dur > 0 ? dur : null
					}
				} catch {
					return null
				}
			}

			const formatStopWhen = (stop) => {
				const parts = []
				if (stop.startDateMs) {
					try {
						parts.push(new Date(stop.startDateMs).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))
					} catch {}
				}
				if (stop.durationMinutes) {
					const h = Math.floor(stop.durationMinutes / 60)
					const m = stop.durationMinutes % 60
					parts.push(h ? (m ? `${h}h ${m}m` : `${h}h`) : `${m}m`)
				}
				return parts.join(" · ")
			}

			const renderStopCard = (stop) => {
				const card = document.createElement("div")
				card.className = "stopCard"

				const head = document.createElement("div")
				head.className = "stopHead"
				const pin = document.createElement("div")
				pin.className = "stopPin"
				pin.textContent = "📍"
				const titleWrap = document.createElement("div")
				titleWrap.className = "stopTitleWrap"
				const t = document.createElement("div")
				t.className = "stopTitle"
				t.textContent = stop.title || stop.address || "Stop"
				titleWrap.appendChild(t)
				if (stop.address && stop.title) {
					const a = document.createElement("div")
					a.className = "stopAddress"
					a.textContent = stop.address
					titleWrap.appendChild(a)
				}
				head.appendChild(pin)
				head.appendChild(titleWrap)
				card.appendChild(head)

				const when = formatStopWhen(stop)
				if (when) {
					const w = document.createElement("div")
					w.className = "stopWhen"
					w.textContent = when
					card.appendChild(w)
				}

				if (stop.lat != null && stop.lng != null) {
					const link = document.createElement("a")
					link.className = "stopMapLink"
					link.href = `https://maps.apple.com/?ll=${stop.lat},${stop.lng}&q=${encodeURIComponent(stop.title || stop.address || "Stop")}`
					link.target = "_blank"
					link.rel = "noopener noreferrer"
					link.textContent = "View on map ↗"
					card.appendChild(link)
				}
				return card
			}

			const renderNoteView = (noteUuid, fromCollectionId) => {
				const payload = state.payload
				const note = (payload?.notes || []).find((n) => n.uuid === noteUuid)
				if (!note) {
					if (fromCollectionId) { renderCollectionView(fromCollectionId); return }
					renderHubView()
					return
				}
				state.selectedCollectionId = fromCollectionId || null
				state.selectedNoteUuid = noteUuid
				showDetail()
				hubTitleEl.style.display = "none"

				if (fromCollectionId) {
					setNav({ back: { target: { collectionId: fromCollectionId }, label: "← Back to collection" }, home: true })
				} else {
					setNav({ home: true })
				}

				const noteTitle = noteTitleFromBlocks(note)
				document.title = `${noteTitle} · Konuq`
				// The note's own TITLE block acts as the heading, so hide the detail head.
				const headEl = detailEl.querySelector(".detailHead")
				if (headEl) headEl.style.display = "none"
				detailBodyEl.innerHTML = ""

				const reader = document.createElement("div")
				reader.className = "reader"

				// Image rows that follow each other are one carousel, exactly as the editor
				// shows them: photos at the block's size, side by side on wide screens (one per
				// 380px, three at most), a caption under each photo, one dot per scroll stop,
				// and a tap opening the full-screen viewer that swipes through the same photos.
				const isWebImage = (b) => b.type === "IMAGE" && b.mediaReference && String(b.mediaReference).startsWith("media:") && !!resolveImageURL(b.mediaReference)
				const mediaHeight = (b) => {
					const style = String(b.mediaStyle || "MEDIUM").toUpperCase()
					return style === "SMALL" ? 140 : style === "LARGE" ? 320 : 220
				}
				const captionOf = (b) => String(b.markdown || "").trim()
				const renderMediaPage = (b, index, onTap) => {
					const page = document.createElement("figure")
					page.className = "mediaPage"
					const img = document.createElement("img")
					img.loading = "lazy"
					img.decoding = "async"
					img.src = resolveImageURL(b.mediaReference)
					img.style.height = `${mediaHeight(b)}px`
					const caption = captionOf(b)
					img.alt = caption ? mdToPlainText(caption) : ""
					img.addEventListener("click", () => onTap(index))
					page.appendChild(img)
					const cap = document.createElement("figcaption")
					cap.className = "mediaCaption"
					if (caption) renderBlockMarkdown(cap, caption)
					page.appendChild(cap)
					return page
				}
				const openLightbox = (items, startIndex) => {
					const box = document.createElement("div")
					box.className = "lightbox"
					const track = document.createElement("div")
					track.className = "lightboxTrack"
					for (const b of items) {
						const page = document.createElement("figure")
						page.className = "lightboxPage"
						const img = document.createElement("img")
						img.src = resolveImageURL(b.mediaReference)
						img.decoding = "async"
						const caption = captionOf(b)
						img.alt = caption ? mdToPlainText(caption) : ""
						page.appendChild(img)
						if (caption) {
							const cap = document.createElement("figcaption")
							cap.className = "lightboxCaption"
							renderBlockMarkdown(cap, caption)
							page.appendChild(cap)
						}
						track.appendChild(page)
					}
					box.appendChild(track)
					const close = document.createElement("button")
					close.type = "button"
					close.className = "lightboxClose"
					close.setAttribute("aria-label", "Close")
					close.textContent = "×"
					box.appendChild(close)
					let dotEls = []
					if (items.length > 1) {
						const dots = document.createElement("div")
						dots.className = "galleryDots lightboxDots"
						dotEls = items.map((_, i) => {
							const dot = document.createElement("button")
							dot.type = "button"
							dot.className = "galleryDot" + (i === startIndex ? " on" : "")
							dot.addEventListener("click", (e) => {
								e.stopPropagation()
								track.scrollTo({ left: track.clientWidth * i, behavior: "smooth" })
							})
							dots.appendChild(dot)
							return dot
						})
						box.appendChild(dots)
					}
					const closeBox = () => {
						document.removeEventListener("keydown", onKey)
						box.remove()
						document.body.style.overflow = ""
					}
					const onKey = (e) => {
						if (e.key === "Escape") { e.preventDefault(); closeBox() }
						// Handled here so the page's own scroll containers stay put.
						if (e.key === "ArrowRight") { e.preventDefault(); track.scrollBy({ left: track.clientWidth, behavior: "smooth" }) }
						if (e.key === "ArrowLeft") { e.preventDefault(); track.scrollBy({ left: -track.clientWidth, behavior: "smooth" }) }
					}
					document.addEventListener("keydown", onKey)
					close.addEventListener("click", closeBox)
					// A tap on the black (not on the photo or its caption) closes, like the app.
					box.addEventListener("click", (e) => { if (e.target === box || e.target === track || e.target.classList.contains("lightboxPage")) closeBox() })
					track.addEventListener("scroll", () => {
						const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth))
						dotEls.forEach((d, j) => d.classList.toggle("on", j === i))
					}, { passive: true })
					document.body.appendChild(box)
					document.body.style.overflow = "hidden"
					track.scrollTo({ left: track.clientWidth * startIndex })
					// Keyboard focus moves into the viewer so arrows and Escape reach it first.
					box.tabIndex = -1
					box.focus({ preventScroll: true })
				}
				const renderGallery = (items) => {
					const media = document.createElement("div")
					media.className = items.length > 1 ? "media gallery" : "media"
					const track = document.createElement("div")
					track.className = "galleryTrack"
					const onTap = (index) => openLightbox(items, index)
					items.forEach((b, i) => track.appendChild(renderMediaPage(b, i, onTap)))
					media.appendChild(track)
					if (items.length <= 1) return media

					// Same rule as the editor: one photo per 380px of width, three at most.
					const columns = () => Math.max(1, Math.min(3, Math.floor(track.clientWidth / 380)))
					let cols = 0
					const applyColumns = () => {
						const wanted = columns()
						if (wanted === cols) return
						cols = wanted
						media.style.setProperty("--cols", String(cols))
					}
					const pageWidth = () => track.firstElementChild ? track.firstElementChild.getBoundingClientRect().width + 8 : track.clientWidth
					const positions = () => Math.max(1, items.length - cols + 1)

					const dots = document.createElement("div")
					dots.className = "galleryDots"
					const dotEls = items.map((_, i) => {
						const dot = document.createElement("button")
						dot.type = "button"
						dot.className = "galleryDot" + (i === 0 ? " on" : "")
						dot.setAttribute("aria-label", `Photo ${i + 1} of ${items.length}`)
						dot.addEventListener("click", () => {
							track.scrollTo({ left: pageWidth() * i, behavior: "smooth" })
						})
						dots.appendChild(dot)
						return dot
					})
					const refreshDots = () => {
						applyColumns()
						const count = positions()
						dots.style.display = count > 1 ? "" : "none"
						const current = Math.min(count - 1, Math.round(track.scrollLeft / Math.max(1, pageWidth())))
						dotEls.forEach((d, j) => {
							d.style.display = j < count ? "" : "none"
							d.classList.toggle("on", j === current)
						})
					}
					track.addEventListener("scroll", refreshDots, { passive: true })
					window.addEventListener("resize", refreshDots)
					requestAnimationFrame(refreshDots)
					media.appendChild(dots)
					return media
				}

				const orderedBlocks = (note.blocks || []).slice().sort((a, c) => Number(a.position || 0) - Number(c.position || 0))
				let pendingGallery = []
				const flushGallery = () => {
					if (pendingGallery.length) reader.appendChild(renderGallery(pendingGallery))
					pendingGallery = []
				}
				for (const b of orderedBlocks) {
					if (isWebImage(b)) {
						pendingGallery.push(b)
						continue
					}
					flushGallery()
					if (b.type === "VIDEO" || (b.mediaReference && String(b.mediaReference).startsWith("phasset:"))) {
						const d = document.createElement("div")
						d.className = "block"
						d.textContent = "Video not available on web"
						reader.appendChild(d)
						continue
					}

					if (b.type === "STOP") {
						const stop = parseStopBlock(b)
						if (stop) {
							reader.appendChild(renderStopCard(stop))
							continue
						}
					}

					const div = document.createElement("div")
					div.className = blockClass(b.type)
					renderBlockMarkdown(div, blockMarkdown(b))
					reader.appendChild(div)
				}
				flushGallery()

				detailBodyEl.appendChild(reader)
				window.scrollTo(0, 0)
			}

			const renderRoute = ({ collectionId = null, noteUuid = null } = {}) => {
				if (!state.payload) return
				// The detail head is hidden for notes; restore it for other views.
				const headEl = detailEl.querySelector(".detailHead")
				if (headEl) headEl.style.display = ""
				if (noteUuid) { renderNoteView(noteUuid, collectionId); return }
				if (collectionId) { renderCollectionView(collectionId); return }
				renderHubView()
			}

			window.addEventListener("popstate", () => {
				if (!state.payload) return
				renderRoute(resolveRouteSegments(parseRoute()))
			})

			const load = async () => {
				const route = parseRoute()
				let shareId = null
				if (route.mode === "slug") {
					statusPillEl.textContent = "Loading"
					const resolved = await resolveSlug(route.hubSlug)
					if (!resolved) {
						renderEmpty("Not found", "This address is not available.")
						return
					}
					shareId = resolved.shareId
					state.hubSlug = resolved.canonicalSlug || route.hubSlug
					// If an old alias was used, rewrite the URL to the current slug.
					if (resolved.redirect && resolved.canonicalSlug) {
						const tail = [route.collectionSlug, route.noteSlug].filter(Boolean).map(encodeURIComponent).join("/")
						history.replaceState(null, "", `/${encodeURIComponent(resolved.canonicalSlug)}${tail ? "/" + tail : ""}`)
					}
				} else {
					shareId = route.shareId
					state.hubSlug = null
				}
				if (!shareId) {
					const atRoot = window.location.pathname === "/" && !window.location.search
					if (atRoot) {
						renderEmpty("Konuq", "This space is published with Konuq.")
					} else {
						renderEmpty("Missing link", "No address found in URL.")
					}
					return
				}
				state.shareId = shareId

				try {
					statusPillEl.textContent = "Loading"
					const res = await fetch(payloadURL(shareId), { cache: "no-store" })
					if (!res.ok) {
						renderEmpty("Not found", "This hub link is not available.")
						return
					}
					const payload = await res.json()
					if (payload && payload.disabled === true) {
						renderEmpty("Not available", payload.message || "This hub is no longer available.")
						return
					}
					state.payload = payload
					buildCollectionSlugMaps()
					hubTitleEl.textContent = payload?.hub?.title || "Konuq Hub"
					statusPillEl.textContent = "Public"
					renderRoute(resolveRouteSegments(route))
				} catch {
					renderEmpty("Load failed", "Unable to fetch the published hub.")
				}
			}

			load()
		</script>
	</body>
</html>
